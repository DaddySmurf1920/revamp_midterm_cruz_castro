<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shipping Method - Revamp</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
  <style>
    :root {
        --color-black: #000000;
        --color-dark-gray: #1f1f1f;
        --color-bg-textured: #dedcd8;
        --color-card-bg: rgba(235, 233, 228, 0.92);
        --color-white: #ffffff;
        --font-logo: 'Alex Brush', cursive;
        --font-heading: 'Times New Roman', serif;
        --font-body: 'Inter', sans-serif;
    }
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }
    body {
        background-color: var(--color-bg-textured);
        color: var(--color-black);
        font-family: var(--font-body);
        min-height: 100vh;
    }
    .site-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 40px;
    }
    .site-logo {
        font-family: var(--font-logo);
        font-size: 52px;
        text-decoration: none;
        color: var(--color-black);
        font-weight: normal;
    }
    .nav-links {
        display: flex;
        gap: 25px;
        list-style: none;
    }
    .nav-links a {
        text-decoration: none;
        color: var(--color-black);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: 1px;
    }
    .shipping-container {
        max-width: 800px;
        margin: 40px auto;
        padding: 30px;
        background: var(--color-card-bg);
        border: 1px solid rgba(0, 0, 0, 0.12);
        box-shadow: 0px 6px 14px rgba(0, 0, 0, 0.08);
        border-radius: 2px;
    }
    .shipping-page-title {
        font-family: var(--font-heading);
        text-transform: uppercase;
        font-size: 24px;
        letter-spacing: 2px;
        margin-bottom: 20px;
        border-bottom: 2px solid var(--color-black);
        padding-bottom: 10px;
    }
    .shipping-option {
        border: 1px solid rgba(0, 0, 0, 0.12);
        padding: 15px;
        margin-bottom: 12px;
        display: flex;
        align-items: flex-start;
        gap: 12px;
        cursor: pointer;
        background: var(--color-white);
        transition: border-color 0.2s;
    }
    .shipping-option:hover, .shipping-option.active {
        border-color: var(--color-black);
    }
    .shipping-option input[type="radio"] {
        accent-color: var(--color-black);
        margin-top: 4px;
    }
    .shipping-details {
        flex: 1;
    }
    .shipping-title {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 17px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .shipping-desc {
        font-size: 13px;
        color: var(--color-dark-gray);
        margin-top: 4px;
        font-family: var(--font-body);
    }
    .shipping-price {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 16px;
    }
    .shipping-notes-wrap {
        margin-top: 20px;
    }
    .shipping-notes-label {
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
        display: block;
    }
    .shipping-notes-textarea {
        width: 100%;
        height: 60px;
        margin-top: 6px;
        border: 1px solid rgba(0,0,0,0.2);
        padding: 8px;
        box-sizing: border-box;
        font-family: var(--font-body);
        border-radius: 4px;
    }
    .btn-submit {
        background-color: var(--color-dark-gray);
        color: var(--color-white);
        border: none;
        padding: 14px 20px;
        width: 100%;
        font-family: monospace;
        font-size: 14px;
        letter-spacing: 1.5px;
        cursor: pointer;
        margin-top: 20px;
        border-radius: 4px;
        transition: background-color 0.2s ease;
    }
    .btn-submit:hover {
        background-color: var(--color-black);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <a href="index.html" class="site-logo">Revamp</a>
    <ul class="nav-links">
      <li><a href="shop.html">Shop</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Contact</a></li>
      <li><a href="#">Search</a></li>
      <li><a href="account.html">Account</a></li>
      <li><a href="cart.html" id="cartNavCount">Cart (0)</a></li>
    </ul>
  </header>

  <main class="shipping-container">
    <h1 class="shipping-page-title">02. Shipping Method</h1>
    
    <form action="checkout.html" method="GET">
      <label class="shipping-option active">
        <input type="radio" name="shipping" value="standard" checked>
        <div class="shipping-details">
          <div class="shipping-title">Standard Courier Express</div>
          <div class="shipping-desc">J&T Express / Flash Express — Estimated delivery: 3 to 5 business days</div>
        </div>
        <div class="shipping-price">₱100.00</div>
      </label>

      <label class="shipping-option">
        <input type="radio" name="shipping" value="express">
        <div class="shipping-details">
          <div class="shipping-title">Same-Day / Priority Delivery</div>
          <div class="shipping-desc">Grab Express / Lalamove (Metro Manila Only) — Estimated delivery: 1 to 2 days</div>
        </div>
        <div class="shipping-price">₱250.00</div>
      </label>

      <label class="shipping-option">
        <input type="radio" name="shipping" value="eco">
        <div class="shipping-details">
          <div class="shipping-title">Eco-Conscious Green Shipping</div>
          <div class="shipping-desc">Consolidated carbon-neutral transit in upcycled poly-mailers — Estimated delivery: 5 to 7 days</div>
        </div>
        <div class="shipping-price">₱80.00</div>
      </label>

      <div class="shipping-notes-wrap">
        <label class="shipping-notes-label">Delivery Notes / Instructions (Optional)</label>
        <textarea class="shipping-notes-textarea" placeholder="e.g. Leave package with house guard or gate drop-box."></textarea>
      </div>

      <button type="submit" class="btn-submit">[ CONTINUE TO PAYMENT ]</button>
    </form>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
